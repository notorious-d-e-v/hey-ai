# Runs the phrase tests and a full universal build on every push and pull request.
name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - name: Check the shell scripts parse
        run: for f in install.sh uninstall.sh scripts/release.sh build.sh tools/snapshot.sh; do bash -n "$f"; done
